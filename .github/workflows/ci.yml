name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      # Optional SDK peers are supplied by the local managed runtime, not npm ci.
      - run: npm install --no-save --package-lock=false @earendil-works/pi-coding-agent@1.0.3 @earendil-works/pi-agent-core@1.0.3 @earendil-works/pi-ai@1.0.3 @earendil-works/pi-tui@1.0.3
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false @earendil-works/pi-coding-agent@1.0.3 @earendil-works/pi-agent-core@1.0.3 @earendil-works/pi-ai@1.0.3 @earendil-works/pi-tui@1.0.3
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
        env:
          E2E_SERVER_MODE: start
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-failure
          path: test-results/e2e/
          retention-days: 7
